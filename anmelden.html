<style>
:root {
  --bg: #0A0A0B; --bg-2: #111113;
  --surface: rgba(255, 255, 255, 0.04); --surface-2: rgba(255, 255, 255, 0.07);
  --glass: rgba(18, 18, 20, 0.72);
  --border: rgba(255, 255, 255, 0.08); --border-strong: rgba(255, 255, 255, 0.16);
  --text: #F5F5F7; --muted: #A1A1A6; --dim: #6E6E73;
  --accent: #FF7A2F; --accent-2: #FFA462; --accent-rgb: 255, 122, 47; --danger: #FF5A4E;
  --radius: 22px; --radius-sm: 14px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1); --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
  --header-h: 64px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scrollbar-color: var(--accent) var(--bg); scrollbar-width: thin; background: var(--bg); }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 20px; }
::selection { background: rgba(var(--accent-rgb), 0.35); color: #fff; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font);
  font-size: 17px; line-height: 1.55; letter-spacing: -0.011em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-x: hidden;
}
h1, h2, h3 { font-weight: 800; letter-spacing: -0.045em; line-height: 1.05; }
button { font-family: inherit; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, label:focus-within {
  outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 10px;
}
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 28px; }
.grad {
  background: linear-gradient(100deg, var(--accent) 0%, var(--accent-2) 55%, var(--accent) 100%);
  background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: grad-shift 6s ease-in-out infinite;
}
@keyframes grad-shift { 50% { background-position: 100% 0; } }
@keyframes rise-in { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
.brand { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; color: var(--text); font-weight: 800; font-size: 21px; letter-spacing: -0.04em; }
.brand img { width: 26px; height: 26px; border-radius: 7px; transition: transform 0.4s var(--spring); }
.brand:hover img { transform: rotate(-10deg) scale(1.08); }
.brand .flow { color: var(--accent); }
.glow {
  position: fixed; border-radius: 50%; pointer-events: none; z-index: -1; filter: blur(60px);
  background: radial-gradient(circle, rgba(var(--accent-rgb), 0.34) 0%, rgba(var(--accent-rgb), 0.1) 40%, transparent 70%);
  animation: glow-float 14s ease-in-out infinite;
}
.glow-1 { width: 720px; height: 720px; top: -300px; left: 50%; margin-left: -360px; }
.glow-2 { width: 520px; height: 520px; bottom: -300px; right: -160px; animation-delay: -6s; opacity: 0.7; }
@keyframes glow-float { 50% { transform: translate3d(40px, 30px, 0) scale(1.08); } }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 24px; font-size: 16px; font-weight: 600; text-decoration: none; cursor: pointer;
  border-radius: 999px; border: 1px solid transparent; background: var(--text); color: #000;
  transition: transform 0.25s var(--spring), background 0.2s ease, box-shadow 0.25s ease, border-color 0.2s ease;
}
.btn:hover { transform: translateY(-2px) scale(1.02); }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: #0A0A0B; box-shadow: 0 8px 30px -8px rgba(var(--accent-rgb), 0.7); }
.btn-primary:hover { background: #FF8A45; box-shadow: 0 12px 40px -6px rgba(var(--accent-rgb), 0.85); }
.btn-ghost { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-sm { padding: 9px 18px; font-size: 14.5px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important; transition-duration: 0.01ms !important; transition-delay: 0ms !important; }
  .reveal { opacity: 1 !important; transform: none !important; }
}

body { min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 90px 20px 40px; position: relative; }
.back-link {
  position: fixed; top: 18px; left: 18px; z-index: 5; display: inline-flex; align-items: center; gap: 6px;
  color: var(--text); text-decoration: none; font-size: 14.5px; font-weight: 500; padding: 9px 16px 9px 12px;
  border-radius: 999px; background: var(--glass); border: 1px solid var(--border-strong);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  transition: transform 0.25s var(--spring), background 0.2s ease; animation: rise-in 0.6s var(--ease) both;
}
.back-link:hover { transform: translateX(-3px); background: var(--surface-2); }
.back-link svg { width: 16px; height: 16px; }
.auth-wrap { position: relative; z-index: 1; width: 100%; max-width: 440px; }
.auth-logo { text-align: center; margin-bottom: 26px; animation: rise-in 0.7s var(--ease) 0.05s both; }
.auth-logo .brand { font-size: 30px; gap: 11px; }
.auth-logo .brand img { width: 38px; height: 38px; border-radius: 10px; }
.auth-card {
  position: relative; padding: 36px 32px; border-radius: 30px;
  background: linear-gradient(180deg, rgba(255,255,255,0.075), rgba(255,255,255,0.02));
  border: 1px solid var(--border-strong);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 40px 100px -30px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.02) inset;
  animation: card-in 0.8s var(--spring) 0.15s both;
}
@keyframes card-in { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: none; } }
.auth-heading { font-size: clamp(30px, 5vw, 38px); font-weight: 800; letter-spacing: -0.045em; text-align: center; line-height: 1.05; }
.auth-sub { color: var(--muted); font-size: 16px; text-align: center; margin: 8px 0 26px; }

.segmented { position: relative; display: flex; background: rgba(0,0,0,0.35); border: 1px solid var(--border); border-radius: 999px; padding: 4px; margin-bottom: 24px; }
.segmented-highlight {
  position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: calc(100% - 8px);
  background: var(--accent); border-radius: 999px; box-shadow: 0 6px 20px -6px rgba(var(--accent-rgb), 0.8);
  transition: transform 0.45s var(--spring);
}
.segmented.mode-register .segmented-highlight { transform: translateX(100%); }
.segmented button {
  flex: 1; position: relative; z-index: 1; background: none; border: none; cursor: pointer;
  padding: 11px 0; font-size: 15px; font-weight: 600; color: var(--muted); transition: color 0.3s ease; border-radius: 999px;
}
.segmented button.active { color: #0A0A0B; }

.auth-fields { display: flex; flex-direction: column; gap: 16px; }
.field { animation: rise-in 0.5s var(--ease) both; }
.field label { display: block; font-size: 13.5px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
.field input {
  width: 100%; padding: 14px 16px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: rgba(0,0,0,0.35); font-family: inherit; font-size: 16px; color: var(--text);
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}
.field input::placeholder { color: var(--dim); }
.field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.15); background: rgba(0,0,0,0.5); }
.field input[type="date"] { color-scheme: dark; }
.account-type-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.account-type-option {
  display: flex; align-items: center; gap: 10px; padding: 13px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong); background: rgba(0,0,0,0.25); font-size: 14.5px; font-weight: 500;
  color: var(--text); cursor: pointer; transition: border-color 0.2s ease, background 0.2s ease, transform 0.25s var(--spring);
}
.account-type-option:hover { transform: translateY(-1px); }
.account-type-option:has(input:checked) { border-color: var(--accent); background: rgba(var(--accent-rgb), 0.12); }
.account-type-option input { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
.auth-error {
  display: none; background: rgba(255, 90, 78, 0.12); border: 1px solid rgba(255, 90, 78, 0.5); color: #FFB3AC;
  font-size: 14px; padding: 12px 16px; border-radius: var(--radius-sm); margin-top: 16px;
}
.auth-success {
  display: none; background: rgba(52, 199, 89, 0.12); border: 1px solid rgba(52, 199, 89, 0.5); color: #7EE2A0;
  font-size: 14px; padding: 12px 16px; border-radius: var(--radius-sm);
}
.auth-submit {
  width: 100%; margin-top: 22px; padding: 16px 0; border: none; border-radius: 999px;
  background: var(--accent); color: #0A0A0B; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
  box-shadow: 0 10px 30px -8px rgba(var(--accent-rgb), 0.75);
  transition: transform 0.25s var(--spring), background 0.2s ease, box-shadow 0.25s ease;
}
.auth-submit:hover { background: #FF8A45; transform: translateY(-2px); box-shadow: 0 14px 40px -8px rgba(var(--accent-rgb), 0.9); }
.auth-submit:active { transform: scale(0.98); }
.auth-submit:disabled { opacity: 0.6; cursor: default; transform: none; }
.auth-footnote { text-align: center; font-size: 14px; color: var(--muted); margin-top: 22px; }
.auth-footnote a { color: var(--accent); text-decoration: none; font-weight: 600; }
.auth-footnote a:hover { text-decoration: underline; }
@media (max-width: 480px) {
  .auth-card { padding: 30px 22px; border-radius: 26px; }
  .account-type-row { grid-template-columns: 1fr; }
}
</style>

  <div class="auth-card">
    <h1 class="auth-heading" id="auth-heading">Willkommen zurück</h1>
    <div class="auth-sub" id="auth-sub">Melde dich an, um eine Anzeige aufzugeben.</div>

    <div class="segmented" id="segmented" role="group" aria-label="Anmelden oder registrieren">
      <div class="segmented-highlight"></div>
      <button type="button" class="active" id="seg-login" aria-pressed="true" onclick="setMode('login')">Anmelden</button>
      <button type="button" id="seg-register" aria-pressed="false" onclick="setMode('register')">Registrieren</button>
    </div>

    <form id="auth-form" onsubmit="handleAuthSubmit(event)">
      <div class="auth-fields active" id="fields-common-top">
        <div class="field" id="username-field" style="display:none;">
          <label for="auth-username">Nutzername</label>
          <input type="text" id="auth-username" placeholder="Wie sollen wir dich nennen?">
        </div>
        <div class="field" id="accounttype-field" style="display:none;">
          <label id="auth-account-type-label">Ich bin</label>
          <div class="account-type-row" role="radiogroup" aria-labelledby="auth-account-type-label">
            <label class="account-type-option"><input type="radio" name="auth-account-type" value="unternehmen" checked> Unternehmen / Verein</label>
            <label class="account-type-option"><input type="radio" name="auth-account-type" value="privat"> Privatperson</label>
          </div>
        </div>
        <div class="field">
          <label for="auth-email">E-Mail</label>
          <input type="email" id="auth-email" placeholder="name@email.de" autocomplete="email">
        </div>
        <div class="field">
          <label for="auth-password">Passwort</label>
          <input type="password" id="auth-password" placeholder="Mindestens 6 Zeichen" autocomplete="current-password">
        </div>
      </div>

      <div class="auth-error" id="auth-error" role="alert"></div>
      <button type="submit" class="auth-submit" id="auth-submit-btn">Anmelden</button>
    </form>

    <div class="auth-footnote">Zum Suchen brauchst du keine Anmeldung. <a href="start-jobflow.html#anzeigen">Jobs ansehen</a></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getFirestore, doc, setDoc
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile,
  sendEmailVerification, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBatWo0ZNB21wqirju7ES6QY8wj5xjb2OU",
  authDomain: "jobflow-ostfriesland.firebaseapp.com",
  projectId: "jobflow-ostfriesland",
  storageBucket: "jobflow-ostfriesland.firebasestorage.app",
  messagingSenderId: "405280176207",
  appId: "1:405280176207:web:50e93c97bae812e672523a"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const auth = getAuth(firebaseApp);

let mode = 'login';

function setMode(newMode) {
  mode = newMode;
  document.getElementById('segmented').classList.toggle('mode-register', mode === 'register');
  document.getElementById('seg-login').classList.toggle('active', mode === 'login');
  document.getElementById('seg-register').classList.toggle('active', mode === 'register');
  document.getElementById('seg-login').setAttribute('aria-pressed', String(mode === 'login'));
  document.getElementById('seg-register').setAttribute('aria-pressed', String(mode === 'register'));
  document.getElementById('username-field').style.display = mode === 'register' ? 'block' : 'none';
  document.getElementById('accounttype-field').style.display = mode === 'register' ? 'block' : 'none';
  document.getElementById('auth-heading').textContent = mode === 'login' ? 'Willkommen zurück' : 'Konto erstellen';
  document.getElementById('auth-sub').textContent = mode === 'login'
    ? 'Melde dich an, um eine Anzeige aufzugeben.'
    : 'Dauert nur eine Minute.';
  document.getElementById('auth-submit-btn').textContent = mode === 'login' ? 'Anmelden' : 'Registrieren';
  document.getElementById('auth-error').style.display = 'none';
}
window.setMode = setMode;

function buildRedirectUrl() {
  const params = new URLSearchParams(location.search);
  const next = params.get('next');
  if (next === 'post-jobs') return 'start-jobflow.html?openForm=jobs';
  if (next === 'post-gesuche') return 'start-jobflow.html?openForm=gesuche';
  if (next && /^[a-z0-9-]+\.html(\?[^#]*)?$/i.test(next)) return next;
  return 'start-jobflow.html';
}

async function handleAuthSubmit(event) {
  event.preventDefault();
  const username = document.getElementById('auth-username').value.trim();
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errorEl = document.getElementById('auth-error');
  const submitBtn = document.getElementById('auth-submit-btn');
  errorEl.style.display = 'none';

  if (!email || !password) {
    errorEl.textContent = 'Bitte E-Mail und Passwort ausfüllen.';
    errorEl.style.display = 'block';
    return;
  }
  if (mode === 'register' && username.length < 2) {
    errorEl.textContent = 'Bitte einen Nutzernamen mit mindestens 2 Zeichen angeben.';
    errorEl.style.display = 'block';
    return;
  }
  if (mode === 'register' && password.length < 6) {
    errorEl.textContent = 'Das Passwort muss mindestens 6 Zeichen haben.';
    errorEl.style.display = 'block';
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = mode === 'login' ? 'Wird angemeldet…' : 'Wird erstellt…';

  try {
    if (mode === 'login') {
      await signInWithEmailAndPassword(auth, email, password);
    } else {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(cred.user, { displayName: username });
      const accountTypeInput = document.querySelector('input[name="auth-account-type"]:checked');
      const accountType = accountTypeInput ? accountTypeInput.value : 'unternehmen';
      try { await setDoc(doc(db, 'users', cred.user.uid), { accountType }, { merge: true }); } catch (e) {}
      try { await sendEmailVerification(cred.user); } catch (e) {}
    }
    window.location.href = buildRedirectUrl();
  } catch (e) {
    const messages = {
      'auth/email-already-in-use': 'Diese E-Mail ist bereits registriert. Bitte stattdessen anmelden.',
      'auth/invalid-email': 'Das ist keine gültige E-Mail-Adresse.',
      'auth/weak-password': 'Das Passwort ist zu schwach (mindestens 6 Zeichen).',
      'auth/wrong-password': 'Passwort ist falsch.',
      'auth/invalid-credential': 'E-Mail oder Passwort ist falsch.',
      'auth/user-not-found': 'Kein Konto mit dieser E-Mail gefunden.',
      'auth/too-many-requests': 'Zu viele Versuche. Bitte kurz warten und nochmal versuchen.'
    };
    errorEl.textContent = messages[e.code] || 'Etwas ist schiefgelaufen. Bitte nochmal versuchen.';
    errorEl.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = mode === 'login' ? 'Anmelden' : 'Registrieren';
  }
}
window.handleAuthSubmit = handleAuthSubmit;

// Bereits angemeldete Personen direkt weiterleiten, kein doppeltes Anmelden nötig
onAuthStateChanged(auth, (user) => {
  if (user) {
    window.location.href = buildRedirectUrl();
  }
});

const params = new URLSearchParams(location.search);
if (params.get('mode') === 'register') setMode('register');
</script>

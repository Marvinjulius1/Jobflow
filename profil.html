<style>
:root {
  --bg: #0A0A0B; --bg-2: #111113;
  --surface: rgba(255, 255, 255, 0.04); --surface-2: rgba(255, 255, 255, 0.07);
  --glass: rgba(18, 18, 20, 0.72);
  --border: rgba(255, 255, 255, 0.08); --border-strong: rgba(255, 255, 255, 0.16);
  --text: #F5F5F7; --muted: #A1A1A6; --dim: #6E6E73;
  --accent: #FF7A2F; --accent-2: #FFA462; --accent-rgb: 255, 122, 47; --danger: #FF5A4E;
  --radius: 22px; --radius-sm: 14px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1); --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --header-h: 64px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scrollbar-color: var(--accent) var(--bg); scrollbar-width: thin; background: var(--bg); }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 20px; }
::selection { background: rgba(var(--accent-rgb), 0.35); color: #fff; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font);
  font-size: 17px; line-height: 1.55; letter-spacing: -0.011em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-x: hidden;
}
h1, h2, h3 { font-weight: 800; letter-spacing: -0.045em; line-height: 1.05; }
button { font-family: inherit; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, label:focus-within {
  outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 10px;
}
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 28px; }
.grad { color: var(--accent); }
@keyframes rise-in { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
.brand { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; color: var(--text); font-weight: 800; font-size: 21px; letter-spacing: -0.04em; }
.brand img { width: 26px; height: 26px; border-radius: 7px; transition: transform 0.4s var(--spring); }
.brand:hover img { transform: rotate(-10deg) scale(1.08); }
.brand .flow { color: var(--accent); }
.glow { display: none; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 24px; font-size: 16px; font-weight: 600; text-decoration: none; cursor: pointer;
  border-radius: 999px; border: 1px solid transparent; background: var(--text); color: #000;
  transition: transform 0.25s var(--spring), background 0.2s ease, box-shadow 0.25s ease, border-color 0.2s ease;
}
.btn:hover { transform: translateY(-2px) scale(1.02); }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: #0A0A0B; }
.btn-primary:hover { background: #FF8A45; }
.btn-ghost { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-sm { padding: 9px 18px; font-size: 14.5px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important; transition-duration: 0.01ms !important; transition-delay: 0ms !important; }
  .reveal { opacity: 1 !important; transform: none !important; }
}

body { min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 90px 20px 40px; position: relative; }
.back-link {
  position: fixed; top: 18px; left: 18px; z-index: 5; display: inline-flex; align-items: center; gap: 6px;
  color: var(--text); text-decoration: none; font-size: 14.5px; font-weight: 500; padding: 9px 16px 9px 12px;
  border-radius: 999px; background: var(--glass); border: 1px solid var(--border-strong);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  transition: transform 0.25s var(--spring), background 0.2s ease; animation: rise-in 0.6s var(--ease) both;
}
.back-link:hover { transform: translateX(-3px); background: var(--surface-2); }
.back-link svg { width: 16px; height: 16px; }
.auth-wrap { position: relative; z-index: 1; width: 100%; max-width: 440px; }
.auth-logo { text-align: center; margin-bottom: 26px; animation: rise-in 0.7s var(--ease) 0.05s both; }
.auth-logo .brand { font-size: 30px; gap: 11px; }
.auth-logo .brand img { width: 38px; height: 38px; border-radius: 10px; }
.auth-card {
  position: relative; padding: 36px 32px; border-radius: 30px;
  background: #141416; border: 1px solid var(--border-strong);
  animation: card-in 0.8s var(--spring) 0.15s both;
}
@keyframes card-in { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: none; } }
.auth-heading { font-size: clamp(30px, 5vw, 38px); font-weight: 800; letter-spacing: -0.045em; text-align: center; line-height: 1.05; }
.auth-sub { color: var(--muted); font-size: 16px; text-align: center; margin: 8px 0 26px; }

.segmented { position: relative; display: flex; background: rgba(0,0,0,0.35); border: 1px solid var(--border); border-radius: 999px; padding: 4px; margin-bottom: 24px; }
.segmented-highlight {
  position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: calc(100% - 8px);
  background: var(--accent); border-radius: 999px;
  transition: transform 0.45s var(--spring);
}
.segmented.mode-register .segmented-highlight { transform: translateX(100%); }
.segmented button {
  flex: 1; position: relative; z-index: 1; background: none; border: none; cursor: pointer;
  padding: 11px 0; font-size: 15px; font-weight: 600; color: var(--muted); transition: color 0.3s ease; border-radius: 999px;
}
.segmented button.active { color: #0A0A0B; }

.auth-fields { display: flex; flex-direction: column; gap: 16px; }
.field { animation: rise-in 0.5s var(--ease) both; }
.field label { display: block; font-size: 13.5px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
.field input {
  width: 100%; padding: 14px 16px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: rgba(0,0,0,0.35); font-family: inherit; font-size: 16px; color: var(--text);
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}
.field input::placeholder { color: var(--dim); }
.field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.15); background: rgba(0,0,0,0.5); }
.field input[type="date"] { color-scheme: dark; }
.account-type-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.account-type-option {
  display: flex; align-items: center; gap: 10px; padding: 13px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong); background: rgba(0,0,0,0.25); font-size: 14.5px; font-weight: 500;
  color: var(--text); cursor: pointer; transition: border-color 0.2s ease, background 0.2s ease, transform 0.25s var(--spring);
}
.account-type-option:hover { transform: translateY(-1px); }
.account-type-option:has(input:checked) { border-color: var(--accent); background: rgba(var(--accent-rgb), 0.12); }
.account-type-option input { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
.auth-error {
  display: none; background: rgba(255, 90, 78, 0.12); border: 1px solid rgba(255, 90, 78, 0.5); color: #FFB3AC;
  font-size: 14px; padding: 12px 16px; border-radius: var(--radius-sm); margin-top: 16px;
}
.auth-success {
  display: none; background: rgba(52, 199, 89, 0.12); border: 1px solid rgba(52, 199, 89, 0.5); color: #7EE2A0;
  font-size: 14px; padding: 12px 16px; border-radius: var(--radius-sm);
}
.auth-submit {
  width: 100%; margin-top: 22px; padding: 16px 0; border: none; border-radius: 999px;
  background: var(--accent); color: #0A0A0B; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
  transition: transform 0.25s var(--spring), background 0.2s ease;
}
.auth-submit:hover { background: #FF8A45; }
.auth-submit:active { transform: scale(0.98); }
.auth-submit:disabled { opacity: 0.6; cursor: default; transform: none; }
.auth-footnote { text-align: center; font-size: 14px; color: var(--muted); margin-top: 22px; }
.auth-footnote a { color: var(--accent); text-decoration: none; font-weight: 600; }
.auth-footnote a:hover { text-decoration: underline; }
@media (max-width: 480px) {
  .auth-card { padding: 30px 22px; border-radius: 26px; }
  .account-type-row { grid-template-columns: 1fr; }
}

.auth-submit { margin-top: 6px; }
.field-row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; }
.optional-divider {
  display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 600; color: var(--dim); margin: 6px 0 -2px;
}
.optional-divider::before, .optional-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.avatar-field { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 4px; }
.avatar-preview {
  position: relative; width: 108px; height: 108px; border-radius: 50%; display: grid; place-items: center; overflow: hidden;
  background: var(--accent); padding: 3px;
}
.avatar-preview::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: #1A1A1D; }
.avatar-preview img { position: relative; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
#avatar-placeholder { position: relative; font-size: 38px; font-weight: 800; color: var(--muted); }
.avatar-actions { display: flex; gap: 10px; align-items: center; }
.avatar-upload-btn {
  font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; padding: 8px 16px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--border-strong); transition: background 0.2s ease;
}
.avatar-upload-btn:hover { background: rgba(255,255,255,0.12); }
.avatar-remove-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 8px 6px; font-size: 14px; font-weight: 500; }
.avatar-remove-btn:hover { color: var(--danger); }
.verify-box { padding: 14px 16px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); font-size: 14px; line-height: 1.5; background: rgba(0,0,0,0.25); }
.verify-box.verified { color: #7EE2A0; border-color: rgba(52, 199, 89, 0.5); background: rgba(52, 199, 89, 0.08); }
.verify-box.unverified { color: var(--muted); }
.verify-box button { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 14px; font-weight: 600; }
.verify-box button:disabled { opacity: 0.6; cursor: default; }
@media (max-width: 480px) { .field-row { grid-template-columns: 1fr; } }
</style>
</head>

  <div class="auth-card">
    <h1 class="auth-heading">Dein Profil</h1>
    <div class="auth-sub">Nutzername, Bild und Angaben anpassen.</div>

    <form id="profile-form" onsubmit="handleProfileSubmit(event)">
      <div class="auth-fields">

        <div class="field avatar-field">
          <div class="avatar-preview" id="avatar-preview">
            <span id="avatar-placeholder">?</span>
            <img id="avatar-img" alt="Dein Profilbild" style="display:none;">
          </div>
          <div class="avatar-actions">
            <label class="avatar-upload-btn" for="profile-avatar-input">Bild auswählen</label>
            <input type="file" id="profile-avatar-input" accept="image/*" style="display:none;" onchange="handleAvatarSelect(event)">
            <button type="button" class="avatar-remove-btn" id="avatar-remove-btn" style="display:none;" onclick="removeAvatar()">Entfernen</button>
          </div>
        </div>

        <div class="field">
          <label for="profile-username">Nutzername</label>
          <input type="text" id="profile-username" placeholder="Wie sollen wir dich nennen?">
        </div>
        <div class="field">
          <label id="profile-account-type-label">Ich bin</label>
          <div class="account-type-row" role="radiogroup" aria-labelledby="profile-account-type-label">
            <label class="account-type-option"><input type="radio" name="profile-account-type" value="unternehmen"> Unternehmen / Verein</label>
            <label class="account-type-option"><input type="radio" name="profile-account-type" value="privat"> Privatperson</label>
          </div>
        </div>

        <div class="optional-divider">Optionale Angaben</div>

        <div class="field">
          <label for="profile-geburtsdatum">Geburtsdatum</label>
          <input type="date" id="profile-geburtsdatum">
        </div>
        <div class="field">
          <label for="profile-strasse">Straße &amp; Hausnummer</label>
          <input type="text" id="profile-strasse" placeholder="Musterstraße 12">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="profile-plz">PLZ</label>
            <input type="text" id="profile-plz" placeholder="26603" inputmode="numeric">
          </div>
          <div class="field">
            <label for="profile-ort">Ort</label>
            <input type="text" id="profile-ort" placeholder="Aurich">
          </div>
        </div>
        <div class="field">
          <label for="profile-telefon">Telefonnummer</label>
          <input type="tel" id="profile-telefon" placeholder="0176 12345678">
        </div>

        <div class="verify-box" id="verify-box">Lade Status…</div>

        <div class="auth-success" id="profile-success" role="status">Gespeichert!</div>
        <div class="auth-error" id="profile-error" role="alert"></div>
        <button type="submit" class="auth-submit" id="profile-submit-btn">Speichern</button>
      </div>
    </form>

    <div class="auth-footnote"><a href="start-jobflow.html">Ohne Speichern zurück zu Jobflow</a></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-lite.js";
import {
  getAuth, updateProfile, sendEmailVerification, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBatWo0ZNB21wqirju7ES6QY8wj5xjb2OU",
  authDomain: "jobflow-ostfriesland.firebaseapp.com",
  projectId: "jobflow-ostfriesland",
  storageBucket: "jobflow-ostfriesland.firebasestorage.app",
  messagingSenderId: "405280176207",
  appId: "1:405280176207:web:50e93c97bae812e672523a"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const auth = getAuth(firebaseApp);

let currentUser = null;
let avatarBase64 = null;
const MAX_AVATAR_BYTES = 300 * 1024;

function handleAvatarSelect(event) {
  const file = event.target.files[0];
  const errorEl = document.getElementById('profile-error');
  errorEl.style.display = 'none';
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    errorEl.textContent = 'Bitte eine Bilddatei auswählen.';
    errorEl.style.display = 'block';
    event.target.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    const tempImg = new Image();
    tempImg.onload = () => {
      const maxDim = 400;
      let { width, height } = tempImg;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else { width = Math.round(width * (maxDim / height)); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(tempImg, 0, 0, width, height);

      let quality = 0.85;
      let result = canvas.toDataURL('image/jpeg', quality);
      while (result.length * 0.75 > MAX_AVATAR_BYTES && quality > 0.35) {
        quality -= 0.1;
        result = canvas.toDataURL('image/jpeg', quality);
      }

      if (result.length * 0.75 > MAX_AVATAR_BYTES) {
        errorEl.textContent = 'Bild ist auch nach dem Verkleinern noch zu groß. Bitte ein anderes Bild versuchen.';
        errorEl.style.display = 'block';
        event.target.value = '';
        return;
      }

      avatarBase64 = result;
      showAvatarPreview(avatarBase64);
    };
    tempImg.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function showAvatarPreview(src) {
  const img = document.getElementById('avatar-img');
  const placeholder = document.getElementById('avatar-placeholder');
  const removeBtn = document.getElementById('avatar-remove-btn');
  if (src) {
    img.src = src;
    img.style.display = 'block';
    placeholder.style.display = 'none';
    removeBtn.style.display = 'inline';
  } else {
    img.style.display = 'none';
    placeholder.style.display = 'block';
    removeBtn.style.display = 'none';
  }
}

function removeAvatar() {
  avatarBase64 = null;
  document.getElementById('profile-avatar-input').value = '';
  showAvatarPreview(null);
}
window.handleAvatarSelect = handleAvatarSelect;
window.removeAvatar = removeAvatar;

function renderVerifyBox() {
  const box = document.getElementById('verify-box');
  if (!currentUser) return;
  box.innerHTML = '';
  if (currentUser.emailVerified) {
    box.className = 'verify-box verified';
    box.textContent = 'E-Mail-Adresse bestätigt. Deine Stellenanzeigen zeigen das Verifiziert-Häkchen.';
  } else {
    box.className = 'verify-box unverified';
    const text = document.createElement('span');
    text.textContent = 'E-Mail-Adresse noch nicht bestätigt. ';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'Bestätigungs-E-Mail erneut senden';
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        await sendEmailVerification(currentUser);
        text.textContent = 'Neue Bestätigungs-E-Mail wurde geschickt. ';
      } catch (e) {
        text.textContent = 'Konnte nicht gesendet werden, bitte später nochmal versuchen. ';
        btn.disabled = false;
      }
    });
    box.appendChild(text);
    box.appendChild(btn);
  }
}

async function fillForm() {
  document.getElementById('profile-username').value = currentUser.displayName || '';
  let accountType = 'unternehmen';
  try {
    const snap = await getDoc(doc(db, 'users', currentUser.uid));
    if (snap.exists()) {
      const data = snap.data();
      if (data.accountType) accountType = data.accountType;
      document.getElementById('profile-geburtsdatum').value = data.geburtsdatum || '';
      document.getElementById('profile-strasse').value = data.strasse || '';
      document.getElementById('profile-plz').value = data.plz || '';
      document.getElementById('profile-ort').value = data.ort || '';
      document.getElementById('profile-telefon').value = data.telefon || '';
      if (data.profilbild) {
        avatarBase64 = data.profilbild;
        showAvatarPreview(avatarBase64);
      }
    }
  } catch (e) {}
  const radio = document.querySelector('input[name="profile-account-type"][value="' + accountType + '"]');
  if (radio) radio.checked = true;
  renderVerifyBox();
}

async function handleProfileSubmit(event) {
  event.preventDefault();
  const username = document.getElementById('profile-username').value.trim();
  const errorEl = document.getElementById('profile-error');
  const successEl = document.getElementById('profile-success');
  const submitBtn = document.getElementById('profile-submit-btn');
  errorEl.style.display = 'none';
  successEl.style.display = 'none';

  if (username.length < 2) {
    errorEl.textContent = 'Bitte einen Nutzernamen mit mindestens 2 Zeichen angeben.';
    errorEl.style.display = 'block';
    return;
  }

  const accountTypeInput = document.querySelector('input[name="profile-account-type"]:checked');
  const accountType = accountTypeInput ? accountTypeInput.value : 'unternehmen';
  const geburtsdatum = document.getElementById('profile-geburtsdatum').value;
  const strasse = document.getElementById('profile-strasse').value.trim();
  const plz = document.getElementById('profile-plz').value.trim();
  const ort = document.getElementById('profile-ort').value.trim();
  const telefon = document.getElementById('profile-telefon').value.trim();

  submitBtn.disabled = true;
  submitBtn.textContent = 'Wird gespeichert…';
  try {
    await updateProfile(auth.currentUser, { displayName: username });
    await setDoc(doc(db, 'users', auth.currentUser.uid), {
      accountType,
      geburtsdatum: geburtsdatum || null,
      strasse: strasse || null,
      plz: plz || null,
      ort: ort || null,
      telefon: telefon || null,
      profilbild: avatarBase64 || null
    }, { merge: true });
    currentUser = auth.currentUser;
    successEl.style.display = 'block';
  } catch (e) {
    errorEl.textContent = 'Konnte nicht gespeichert werden. Bitte nochmal versuchen.';
    errorEl.style.display = 'block';
  }
  submitBtn.disabled = false;
  submitBtn.textContent = 'Speichern';
}
window.handleProfileSubmit = handleProfileSubmit;

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = 'anmelden.html?next=profil.html';
    return;
  }
  currentUser = user;
  fillForm();
});
</script>

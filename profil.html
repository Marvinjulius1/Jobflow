<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profil bearbeiten — Jobflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #ECECEC;
    --ink-soft: #C9C9C9;
    --paper: #232323;
    --paper-dim: #2C2C2C;
    --line: #3D3D3D;
    --muted: #A0A0A0;
    --accent: #E07B39;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scrollbar-color: var(--accent) var(--paper); scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 12px; }
  ::-webkit-scrollbar-track { background: var(--paper); }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 20px; }
  ::-webkit-scrollbar-thumb:hover { background: #c96a2e; }

  body {
    background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 32px 20px; position: relative; overflow-x: hidden;
  }

  .glow { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: 0; opacity: 0; animation: glow-in 1.8s ease forwards; }
  .glow-1 { width: 420px; height: 420px; background: rgba(224,123,57,0.22); top: -140px; left: -120px; animation-delay: 0.1s; }
  .glow-2 { width: 380px; height: 380px; background: rgba(224,123,57,0.14); bottom: -160px; right: -100px; animation-delay: 0.3s; }
  @keyframes glow-in { to { opacity: 1; } }

  .back-link {
    position: fixed; top: 24px; left: 24px; z-index: 5;
    display: flex; align-items: center; gap: 8px; color: var(--muted); text-decoration: none;
    font-size: 14px; opacity: 0; animation: fade-down 0.6s ease 0.15s forwards;
  }
  .back-link:hover { color: var(--ink); }
  .back-link svg { width: 16px; height: 16px; }
  @keyframes fade-down { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .auth-wrap { position: relative; z-index: 1; width: 100%; max-width: 440px; }

  .auth-logo {
    text-align: center; margin-bottom: 32px;
    opacity: 0; animation: pop-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
  }
  .auth-logo a { font-family: 'Fraunces', serif; font-weight: 500; font-size: 30px; color: var(--ink); text-decoration: none; }
  .auth-logo .flow { color: var(--accent); }

  .auth-card {
    background: var(--paper-dim); border: 1px solid var(--line); border-radius: 24px;
    padding: 36px 32px; box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    opacity: 0; transform: translateY(28px) scale(0.96);
    animation: card-in 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.18s forwards;
  }
  @keyframes pop-in { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  @keyframes card-in { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .glow, .back-link, .auth-logo, .auth-card { animation: none !important; opacity: 1 !important; transform: none !important; }
  }

  .auth-heading { font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px; text-align: center; margin-bottom: 6px; }
  .auth-sub { color: var(--muted); font-size: 14px; text-align: center; margin-bottom: 26px; }

  .auth-fields { display: flex; flex-direction: column; gap: 18px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .optional-divider {
    font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em;
    border-top: 1px solid var(--line); padding-top: 18px; margin-top: 2px;
  }

  .avatar-field { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .avatar-preview {
    width: 88px; height: 88px; border-radius: 50%; background: var(--paper);
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    overflow: hidden; flex-shrink: 0;
  }
  .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
  #avatar-placeholder { font-family: 'Fraunces', serif; font-size: 30px; color: var(--muted); }
  .avatar-actions { display: flex; gap: 14px; align-items: center; }
  .avatar-upload-btn {
    font-size: 13.5px; color: var(--accent); text-decoration: underline; cursor: pointer;
  }
  .avatar-remove-btn {
    background: none; border: none; color: var(--muted); text-decoration: underline;
    cursor: pointer; padding: 0; font-size: 13.5px; font-family: 'Inter', sans-serif;
  }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 7px; }
  .field input {
    width: 100%; padding: 11px 2px; border: none; border-bottom: 1px solid var(--line);
    background: transparent; font-family: 'Inter', sans-serif; font-size: 16px; color: var(--ink);
    transition: border-color 0.2s ease;
  }
  .field input:focus { outline: none; border-color: var(--accent); }

  .account-type-row { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 4px; }
  .account-type-option { display: flex; align-items: center; gap: 7px; font-size: 14px; color: var(--ink); cursor: pointer; }
  .account-type-option input { width: auto; accent-color: var(--accent); }

  .verify-box {
    padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px;
    font-size: 13.5px; text-align: left; line-height: 1.5;
  }
  .verify-box.verified { color: var(--accent); border-color: var(--accent); }
  .verify-box.unverified { color: var(--muted); }
  .verify-box button {
    background: none; border: none; color: var(--accent); text-decoration: underline;
    cursor: pointer; padding: 0; font-size: 13.5px; font-family: 'Inter', sans-serif;
  }
  .verify-box button:disabled { opacity: 0.6; cursor: default; }

  .auth-error {
    display: none; background: rgba(224,90,57,0.12); border: 1px solid #A8402B; color: #F0A088;
    font-size: 13.5px; padding: 10px 14px; border-radius: 10px;
  }
  .auth-success {
    display: none; background: rgba(224,123,57,0.12); border: 1px solid var(--accent); color: var(--accent);
    font-size: 13.5px; padding: 10px 14px; border-radius: 10px;
  }

  .auth-submit {
    width: 100%; padding: 14px 0; border: none; border-radius: 14px;
    background: var(--accent); color: #fff; font-family: 'Inter', sans-serif; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: background 0.2s ease, transform 0.15s ease;
  }
  .auth-submit:hover { background: #c96a2e; }
  .auth-submit:active { transform: scale(0.98); }
  .auth-submit:disabled { opacity: 0.6; cursor: default; }

  .auth-footnote { text-align: center; font-size: 13px; margin-top: 22px; }
  .auth-footnote a { color: var(--accent); text-decoration: none; }
  .auth-footnote a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<a href="start-jobflow.html" class="back-link">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
  Zurück zu Jobflow
</a>

<div class="auth-wrap">
  <div class="auth-logo">
    <a href="start-jobflow.html">Job<span class="flow">flow</span></a>
  </div>

  <div class="auth-card">
    <div class="auth-heading">Profil bearbeiten</div>
    <div class="auth-sub">Nutzername festlegen oder ändern.</div>

    <form id="profile-form" onsubmit="handleProfileSubmit(event)">
      <div class="auth-fields">

        <div class="field avatar-field">
          <div class="avatar-preview" id="avatar-preview">
            <span id="avatar-placeholder">?</span>
            <img id="avatar-img" style="display:none;">
          </div>
          <div class="avatar-actions">
            <label class="avatar-upload-btn" for="profile-avatar-input">Bild auswählen</label>
            <input type="file" id="profile-avatar-input" accept="image/*" style="display:none;" onchange="handleAvatarSelect(event)">
            <button type="button" class="avatar-remove-btn" id="avatar-remove-btn" style="display:none;" onclick="removeAvatar()">Entfernen</button>
          </div>
        </div>

        <div class="field">
          <label for="profile-username">Nutzername</label>
          <input type="text" id="profile-username" placeholder="Wie sollen wir dich nennen?">
        </div>
        <div class="field">
          <label>Ich bin</label>
          <div class="account-type-row">
            <label class="account-type-option"><input type="radio" name="profile-account-type" value="unternehmen"> Unternehmen / Verein</label>
            <label class="account-type-option"><input type="radio" name="profile-account-type" value="privat"> Privatperson</label>
          </div>
        </div>

        <div class="optional-divider">Optionale Angaben</div>

        <div class="field">
          <label for="profile-geburtsdatum">Geburtsdatum</label>
          <input type="date" id="profile-geburtsdatum">
        </div>
        <div class="field">
          <label for="profile-strasse">Straße &amp; Hausnummer</label>
          <input type="text" id="profile-strasse" placeholder="Musterstraße 12">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="profile-plz">PLZ</label>
            <input type="text" id="profile-plz" placeholder="26603" inputmode="numeric">
          </div>
          <div class="field">
            <label for="profile-ort">Ort</label>
            <input type="text" id="profile-ort" placeholder="Aurich">
          </div>
        </div>
        <div class="field">
          <label for="profile-telefon">Telefonnummer</label>
          <input type="tel" id="profile-telefon" placeholder="0176 12345678">
        </div>

        <div class="verify-box" id="verify-box">Lade Status…</div>

        <div class="auth-success" id="profile-success">Gespeichert!</div>
        <div class="auth-error" id="profile-error"></div>
        <button type="submit" class="auth-submit" id="profile-submit-btn">Speichern</button>
      </div>
    </form>

    <div class="auth-footnote"><a href="start-jobflow.html">Ohne Speichern zurück zu Jobflow</a></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
import {
  getAuth, updateProfile, sendEmailVerification, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBatWo0ZNB21wqirju7ES6QY8wj5xjb2OU",
  authDomain: "jobflow-ostfriesland.firebaseapp.com",
  projectId: "jobflow-ostfriesland",
  storageBucket: "jobflow-ostfriesland.firebasestorage.app",
  messagingSenderId: "405280176207",
  appId: "1:405280176207:web:50e93c97bae812e672523a"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const auth = getAuth(firebaseApp);

let currentUser = null;
let avatarBase64 = null;
const MAX_AVATAR_BYTES = 300 * 1024;

function handleAvatarSelect(event) {
  const file = event.target.files[0];
  const errorEl = document.getElementById('profile-error');
  errorEl.style.display = 'none';
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    errorEl.textContent = 'Bitte eine Bilddatei auswählen.';
    errorEl.style.display = 'block';
    event.target.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    const tempImg = new Image();
    tempImg.onload = () => {
      const maxDim = 400;
      let { width, height } = tempImg;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else { width = Math.round(width * (maxDim / height)); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(tempImg, 0, 0, width, height);

      let quality = 0.85;
      let result = canvas.toDataURL('image/jpeg', quality);
      while (result.length * 0.75 > MAX_AVATAR_BYTES && quality > 0.35) {
        quality -= 0.1;
        result = canvas.toDataURL('image/jpeg', quality);
      }

      if (result.length * 0.75 > MAX_AVATAR_BYTES) {
        errorEl.textContent = 'Bild ist auch nach dem Verkleinern noch zu groß. Bitte ein anderes Bild versuchen.';
        errorEl.style.display = 'block';
        event.target.value = '';
        return;
      }

      avatarBase64 = result;
      showAvatarPreview(avatarBase64);
    };
    tempImg.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function showAvatarPreview(src) {
  const img = document.getElementById('avatar-img');
  const placeholder = document.getElementById('avatar-placeholder');
  const removeBtn = document.getElementById('avatar-remove-btn');
  if (src) {
    img.src = src;
    img.style.display = 'block';
    placeholder.style.display = 'none';
    removeBtn.style.display = 'inline';
  } else {
    img.style.display = 'none';
    placeholder.style.display = 'block';
    removeBtn.style.display = 'none';
  }
}

function removeAvatar() {
  avatarBase64 = null;
  document.getElementById('profile-avatar-input').value = '';
  showAvatarPreview(null);
}
window.handleAvatarSelect = handleAvatarSelect;
window.removeAvatar = removeAvatar;

function renderVerifyBox() {
  const box = document.getElementById('verify-box');
  if (!currentUser) return;
  box.innerHTML = '';
  if (currentUser.emailVerified) {
    box.className = 'verify-box verified';
    box.textContent = 'E-Mail-Adresse bestätigt. Deine Stellenanzeigen zeigen das Verifiziert-Häkchen.';
  } else {
    box.className = 'verify-box unverified';
    const text = document.createElement('span');
    text.textContent = 'E-Mail-Adresse noch nicht bestätigt. ';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'Bestätigungs-E-Mail erneut senden';
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        await sendEmailVerification(currentUser);
        text.textContent = 'Neue Bestätigungs-E-Mail wurde geschickt. ';
      } catch (e) {
        text.textContent = 'Konnte nicht gesendet werden, bitte später nochmal versuchen. ';
        btn.disabled = false;
      }
    });
    box.appendChild(text);
    box.appendChild(btn);
  }
}

async function fillForm() {
  document.getElementById('profile-username').value = currentUser.displayName || '';
  let accountType = 'unternehmen';
  try {
    const snap = await getDoc(doc(db, 'users', currentUser.uid));
    if (snap.exists()) {
      const data = snap.data();
      if (data.accountType) accountType = data.accountType;
      document.getElementById('profile-geburtsdatum').value = data.geburtsdatum || '';
      document.getElementById('profile-strasse').value = data.strasse || '';
      document.getElementById('profile-plz').value = data.plz || '';
      document.getElementById('profile-ort').value = data.ort || '';
      document.getElementById('profile-telefon').value = data.telefon || '';
      if (data.profilbild) {
        avatarBase64 = data.profilbild;
        showAvatarPreview(avatarBase64);
      }
    }
  } catch (e) {}
  const radio = document.querySelector('input[name="profile-account-type"][value="' + accountType + '"]');
  if (radio) radio.checked = true;
  renderVerifyBox();
}

async function handleProfileSubmit(event) {
  event.preventDefault();
  const username = document.getElementById('profile-username').value.trim();
  const errorEl = document.getElementById('profile-error');
  const successEl = document.getElementById('profile-success');
  const submitBtn = document.getElementById('profile-submit-btn');
  errorEl.style.display = 'none';
  successEl.style.display = 'none';

  if (username.length < 2) {
    errorEl.textContent = 'Bitte einen Nutzernamen mit mindestens 2 Zeichen angeben.';
    errorEl.style.display = 'block';
    return;
  }

  const accountTypeInput = document.querySelector('input[name="profile-account-type"]:checked');
  const accountType = accountTypeInput ? accountTypeInput.value : 'unternehmen';
  const geburtsdatum = document.getElementById('profile-geburtsdatum').value;
  const strasse = document.getElementById('profile-strasse').value.trim();
  const plz = document.getElementById('profile-plz').value.trim();
  const ort = document.getElementById('profile-ort').value.trim();
  const telefon = document.getElementById('profile-telefon').value.trim();

  submitBtn.disabled = true;
  submitBtn.textContent = 'Wird gespeichert…';
  try {
    await updateProfile(auth.currentUser, { displayName: username });
    await setDoc(doc(db, 'users', auth.currentUser.uid), {
      accountType,
      geburtsdatum: geburtsdatum || null,
      strasse: strasse || null,
      plz: plz || null,
      ort: ort || null,
      telefon: telefon || null,
      profilbild: avatarBase64 || null
    }, { merge: true });
    currentUser = auth.currentUser;
    successEl.style.display = 'block';
  } catch (e) {
    errorEl.textContent = 'Konnte nicht gespeichert werden. Bitte nochmal versuchen.';
    errorEl.style.display = 'block';
  }
  submitBtn.disabled = false;
  submitBtn.textContent = 'Speichern';
}
window.handleProfileSubmit = handleProfileSubmit;

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = 'anmelden.html?next=profil.html';
    return;
  }
  currentUser = user;
  fillForm();
});
</script>

</body>
</html>
